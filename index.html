<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quase Pronto Studios</title>
<meta name="description" content="Quase Pronto Studios: jogos indie feitos com muito café e um lobo.">
<link rel="canonical" href="https://studios.teuzin.com.br/">
<link rel="icon" href="assets/quase-pronto-icone.png">
<meta property="og:title" content="Quase Pronto Studios">
<meta property="og:description" content="Jogos indie feitos com muito café e um lobo.">
<meta property="og:image" content="https://studios.teuzin.com.br/assets/quase-pronto-studios.png">
<style>
:root{--bg:#0d0817;--panel:#150d26;--line:#2a1b4d;--p:#782fe0;--pl:#b58cff;--tx:#e8defa;--dim:#8b7aa8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#1d0f3a 0,var(--bg) 60%) no-repeat,var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;max-width:880px;width:100%;margin:0 auto;padding:3rem 1.2rem}
header{text-align:center}
header img{width:min(420px,80%);height:auto}
h1{margin:.5rem 0 .2rem;font-size:clamp(1.8rem,5vw,2.6rem)}
.lead{color:var(--dim);margin:0 auto 2.5rem;max-width:560px}
h2{font-size:1.1rem;color:var(--pl);text-transform:uppercase;letter-spacing:.12em;margin:0 0 1rem}
.games{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{display:flex;gap:1rem;align-items:center;padding:1rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:.15s}
.card:hover{border-color:var(--p);transform:translateY(-2px)}
.card img{width:64px;height:64px;image-rendering:pixelated;border-radius:8px;background:#000}
.card b{display:block;font-size:1.05rem}
.card span{color:var(--dim);font-size:.9rem}
.links{margin-top:2.5rem;display:flex;gap:1rem;flex-wrap:wrap}
.links a{color:var(--pl)}
footer{text-align:center;color:var(--dim);font-size:.85rem;padding:1.5rem}
</style>
</head>
<body>
<main>
<header>
<img src="assets/quase-pronto-studios.png" alt="Quase Pronto Studios">
<h1>Quase Pronto Studios</h1>
<p class="lead">Jogos indie feitos com muito café. Sempre quase prontos, e sempre melhorando.</p>
</header>
<h2>Jogos</h2>
<div class="games">
<a class="card" href="https://studios.teuzin.com.br/df-horda/">
<img src="assets/df-horda.png" alt="">
<div><b>Dead Frequency: Horda</b><span>Sobrevivência 2D em pixel art, com a van e o rádio.</span></div>
</a>
<a class="card" href="https://studios.teuzin.com.br/dead-frequency/">
<img src="assets/quase-pronto-icone.png" alt="">
<div><b>Dead Frequency</b><span>O jogo original de sobrevivência com rádio.</span></div>
</a>
</div>
<div class="links">
<a href="https://github.com/QuaseProntoStudios">GitHub</a>
<a href="https://www.twitch.tv/teuzin0dev">Twitch</a>
</div>
</main>
<footer>© Quase Pronto Studios</footer>
</body>
</html>
